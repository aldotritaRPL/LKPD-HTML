<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1. INLINE CSS: ditulis langsung di atribut style elemen-->
    <h1 style="color: blue; font-size: 28px;">Judul dengan Inline CSS</h1>
    <p style="color: gray; margin: 10px;">Paragraf dengan Inline CSS</p>

<!-- 2. INTERNAL CSS: ditulis di dalam tag <style> di bagian <head> -->
<head>
    <style>
        h1 {
            color: #1A5276;
            text-align: center;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
        }
    </style>
</head>

<!-- 3. EXTERNAL CSS: file .css terpisah, dihubungkan dengan tag <link> -->
    <head>
        <link rel="stylesheet" href="Coba.html">
    
/* Isi file style.css */
h1 {
        color: #1A5276;
        text-align: center;
    }
    </head>
    
</body>
</html>
