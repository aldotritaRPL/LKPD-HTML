<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAB 3 - Formulir dan Multimedia</title>
    <!-- CSS - STRUKTUR DASAR FORM -->
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 20px; }
        h1 { color: #1A5276; }
        h2 { color: #2E86C1; border-bottom: 2px solid #AED6F1; padding-bottom: 5px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=text], input[type=email], input[type=password],
        input[type=number], input[type=date], input[type=tel],
        textarea, select {
            width: 100%; padding: 8px; margin-top: 4px;
            border: 1px solid #BDC3C7; border-radius: 4px; box-sizing: border-box;
        }
        input[type=submit], input[type=reset] {
            margin-top: 16px; padding: 10px 24px;
            background-color: #2E86C1; color: white;
            border: none; border-radius: 4px; cursor: pointer;
        }
        input[type=reset] { background-color: #BDC3C7; }
        fieldset { border: 2px solid #AED6F1; border-radius: 6px; margin-top: 20px; padding: 16px; }
        legend { font-weight: bold; color: #1A5276; padding: 0 8px; }
    </style>
</head>
<body>
    <h1>Formulir Pendaftaran Siswa Baru</h1>
    <form action="#" method="post">
        <!-- BAGIAN 1 : INPUT DATA DIRI -->
        <fieldset>
            <legend>Data Pribadi</legend>

            <label for="nama">Nama Lengkap: *</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required maxlength="100">

            <label for="nis">NIS (Nomor Induk Siswa): *</label>
            <input type="number" id="nis" name="nis" placeholder="Contoh: 2024001" required>

            <label for="email">Alamat Email: *</label>
            <input type="email" id="email" name="email" placeholder="contoh@emal.com" required>

            <label for="telp">Nomor Telepon:</label>
            <input type="tel" id="telp" name="telp" placeholder="081234567890">

            <label for="tgl_lahir">Tanggal Lahir: *</label>
            <input type="date" id="tgl_lahir" name="tgl_lahir" required>

            <label for="password">Buat Password: *</label>
            <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" minlength="8" required>
        </fieldset>

        <!-- BAGIAN 2 : MENAMBAHKAN PILIHAN DAN DROPDOWN -->
        <fieldset>
            <legend>Data Akademik</legend>
            
            <label>Jenis Kelamin: *</label>
            <div style="margin-top: 6px;">
                <input type="radio" id="laki" name="gender" value="L" required>
                <label for="laki" style="display: inline; font-weight: normal;">Laki-laki</label>
                &nbsp;&nbsp;
                <input type="radio" id="perempuan" name="gender" value="P">
                <label for="Perempuan" style="display: inline; font-weight: normal;">Perempuan</label>
            </div>

            <label for="jurusan">Jurusan: *</label>
            <select id="jurusan" name="jurusan" required>
                <option value="">-- Pilih Jurusan --</option>
                <option value="rpl">Rekayasa Perangkat Lunak (RPL)</option>
                <option value="tkj">Teknik Komputer & Jaringan (TKJ)</option>
                <option value="mm">Multimedia (MM)</option>
                <option value="ak">Akuntansi (AK)</option>
            </select>

            <label>Hobi (boleh lebih dari satu):</label>
            <div style="margin-top: 6px;">
                <input type="checkbox" id="h_coding" name="hobi" value="coding">
                <label for="h_coding" style="display: inline; font-weight: normal;">Coding</label>&nbsp;&nbsp;
                <input type="checkbox" id="h_desain" name="hobi" value="desain">
                <label for="h_desain" style="display: inline; font-weight: normal;">Desain Grafis</label>&nbsp;&nbsp;
                <input type="checkbox" id="h_musik" name="hobi" value="musik">
                <label for="h_musik" style="display: inline; font-weight: normal;">Musik</label>&nbsp;&nbsp;
                <input type="checkbox" id="h_olahraga" name="hobi" value="olahraga">
                <label for="h_olahraga" style="display: inline; font-weight: normal;">Olahraga</label>
            </div>

            <label for="foto">Upload Foto (maks. 2mb):</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </fieldset>

        <!-- BAGIAN 3 : MENAMBAHKAN TEXTAREA & TOMBOL -->
        <fieldset>
            <legend>Informasi Tambahan</legend>

            <label for="alamat">Alamat Lengkap: *</label>
            <textarea id="alamat" name="alamat" rows="4" placeholder="Jl. ...RT/RW ... Kelurahan ... Kecmatan ... Kota ..." required></textarea>

            <label for="alasan">Alasan Memilih Jurusan:</label>
            <textarea id="alasan" name="alasan" rows="5" placeholder="Ceritakan mengapa kamu memilih jurusan tersebut..."></textarea>

            <label for="kepuasan">Tingkat Kepuasan Layanan</label>
            <input type="range" id="kepuasan" name="kepuasan" min="1" max="10" value="5">

            <!-- CHECKBOX PERSETUJUAN -->
            <div style="margin-top: 16px;">
                <input type="checkbox" id="setuju" name="setuju" value="ya" required>
                <label for="setuju" style="display: inline; font-weight: normal;">Saya menyatakan bahwa data yang saya isi adalah benar dan dapat dipertanggungjawabkan.</label>
            </div>
        </fieldset>

        <!-- TOMBOL SUBMIT DAN RESET -->
        <input type="submit" value="Daftar Sekarang">
        <input type="reset" value="Hapus Semua Isian">
        <p style="text-align: right;"><a href="multimedia.html">Halaman Selanjutnya >></a></p>
        
    </form>
    
</body>
</html>
